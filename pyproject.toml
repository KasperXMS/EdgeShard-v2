[project]
name = "edgeshard"
version = "0.0.1"
description = "EdgeShard v2: containerized shard inference runtimes and cluster control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Control-plane core (Phase 1 §6): schemas, configuration, RPC, runtime
    # lifecycle, CLI. The heavy inference stack and host telemetry probes are
    # optional extras so worker/master control stays lightweight.
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "grpcio>=1.66",
    "protobuf>=5.28",
    "docker>=7.1",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Model execution (Phase 0 inference substrate).
inference = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.25",
]
# Worker-side host telemetry and device discovery (Phase 1).
worker = [
    "psutil>=7,<8",
    "nvidia-ml-py>=13,<14",
]

[project.scripts]
edgeshard = "edgeshard.cli:app"

[dependency-groups]
dev = [
    # Keep the full development environment (inference + worker extras) on a
    # plain `uv sync`; the control-plane core alone is the installable base.
    "edgeshard[inference,worker]",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    # protoc codegen for proto/shard_runtime.proto and
    # proto/worker_control.proto (outputs are committed; see
    # scripts/generate_proto.py)
    "grpcio-tools>=1.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeshard"]

[tool.uv]
# CPU-only PyTorch index: Phase 0 Tier 1 correctness work is CPU-only, and
# this development host has no NVIDIA GPU. Container images pin their own
# stacks per Dockerfile (see containers/). This index is `explicit`, so it is
# used only for packages mapped to it in [tool.uv.sources] — everything else
# resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "src/edgeshard/protocol/pb",           # generated shard protobuf code
    "src/edgeshard/protocol/control/pb",   # generated control protobuf code
    "src/edgeshard/protocol/profiling/pb", # generated profiling protobuf code
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"] # assert False is legitimate in tests

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["edgeshard"]
mypy_path = "src"

[[tool.mypy.overrides]]
# These libraries ship no or incomplete type information. The adapter layer
# is the Hugging Face boundary (spec 4.1), so we treat them as opaque here
# instead of fighting partial stubs.
module = ["transformers.*", "accelerate.*", "docker.*", "grpc.*", "psutil.*", "pynvml"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Generated protobuf code (scripts/generate_proto.py). The pb2 module ships
# real .pyi stubs that importers use; errors inside the generated files
# (including the untyped grpc import in pb2_grpc) are suppressed.
module = [
    "edgeshard.protocol.pb.*",
    "edgeshard.protocol.control.pb.*",
    "edgeshard.protocol.profiling.pb.*",
]
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: multi-process pipeline tests",
    "container: tests that require Docker",
    "rtx: tests that require a physical NVIDIA discrete GPU (Phase 1)",
    "jetson: tests that require physical Jetson hardware (Phase 1)",
]
