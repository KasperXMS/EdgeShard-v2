[project]
name = "edgeshard"
version = "0.0.1"
description = "EdgeShard v2 Phase 0: containerized inference runtime foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Model execution
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.25",
    # Schemas and configuration
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    # Shard RPC baseline (correctness/reference transport)
    "grpcio>=1.66",
    "protobuf>=5.28",
    # Runtime container lifecycle
    "docker>=7.1",
    # CLI and HTTP clients
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
edgeshard = "edgeshard.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    # protoc codegen for proto/shard_runtime.proto (outputs are committed;
    # see scripts/generate_proto.py)
    "grpcio-tools>=1.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeshard"]

[tool.uv]
# CPU-only PyTorch index: Phase 0 Tier 1 correctness work is CPU-only, and
# this development host has no NVIDIA GPU. Container images pin their own
# stacks per Dockerfile (see containers/). This index is `explicit`, so it is
# used only for packages mapped to it in [tool.uv.sources] — everything else
# resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/edgeshard/protocol/pb"] # generated protobuf code

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"] # assert False is legitimate in tests

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["edgeshard"]
mypy_path = "src"

[[tool.mypy.overrides]]
# These libraries ship no or incomplete type information. The adapter layer
# is the Hugging Face boundary (spec 4.1), so we treat them as opaque here
# instead of fighting partial stubs.
module = ["transformers.*", "accelerate.*", "docker.*", "grpc.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Generated protobuf code (scripts/generate_proto.py). The pb2 module ships
# real .pyi stubs that importers use; errors inside the generated files
# (including the untyped grpc import in pb2_grpc) are suppressed.
module = ["edgeshard.protocol.pb.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: multi-process pipeline tests",
    "container: tests that require Docker",
]
