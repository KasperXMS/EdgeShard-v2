# Example: three EdgeShard shard runtimes forming one tiny Llama pipeline.
#
# Same model as tiny-llama-2shard.yaml, split differently: a valid
# partition change must not change deterministic output (invariant 9).
# The Mock Master deploys this manifest end to end (spec 22).
execution_id: exec-example-3shard

model:
  id: tiny/llama
  local_name: tiny-llama

runtimes:
  - id: shard-0
    backend: edgeshard_shard
    shard:
      start: 0
      end: 1
      include_input_stage: true

  - id: shard-1
    backend: edgeshard_shard
    shard:
      start: 1
      end: 3

  - id: shard-2
    backend: edgeshard_shard
    shard:
      start: 3
      end: 4
      include_output_stage: true

pipeline:
  - shard-0
  - shard-1
  - shard-2
