# Example: two EdgeShard shard runtimes forming one tiny Llama pipeline.
#
# The Mock Master deploys this manifest end to end (spec 22): it creates
# the Docker network edgeshard-exec-<execution_id>, generates one runtime
# config per stage, launches the containers, and waits for readiness — no
# manual Docker commands. The partition is provided here; the master only
# validates it.
#
# Model identity is plan-level only: the manifest carries the model id and
# a local name, never a host path. Each worker resolves the local name
# against its own model store root (mounted at /models, spec 21.1), so
# /models/tiny-llama is <model_root>/tiny-llama on every worker.
execution_id: exec-example

model:
  id: tiny/llama
  local_name: tiny-llama

runtimes:
  - id: shard-0
    backend: edgeshard_shard
    shard:
      start: 0
      end: 2
      include_input_stage: true

  - id: shard-1
    backend: edgeshard_shard
    shard:
      start: 2
      end: 4
      include_output_stage: true

pipeline:
  - shard-0
  - shard-1
