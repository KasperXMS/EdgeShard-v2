// EdgeShard v2 Phase 0 — canonical shard protocol (spec 16–17).
//
// These messages are wire DTOs only (spec 17.2): the inference domain model
// lives in Python dataclasses and is mapped explicitly by
// edgeshard.protocol.protobuf_mapper. Tensor payloads travel as a
// safetensors-encoded bundle (spec 5.5, 17.3), never element-by-element.

syntax = "proto3";

package edgeshard.proto;

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_PREFILL = 1;
  PHASE_DECODE = 2;
}

// ShardMessageHeader (spec 16). execution_id, session_id and request_id are
// distinct identity scopes and are not interchangeable (spec 16.1).
message MessageHeader {
  int32 protocol_version = 1;

  string execution_id = 2;
  string session_id = 3;
  string request_id = 4;

  Phase phase = 5;
  int32 step = 6;

  int32 source_stage = 7;
  int32 target_stage = 8;
}

// Scalar part of the canonical ExecutionContext (spec 14). The positions
// tensor travels in the tensor bundle under the key "positions".
message ExecutionContext {
  Phase phase = 1;
  int32 step = 2;

  int32 batch_size = 3;
  repeated int64 sequence_lengths = 4;

  int64 past_length = 5;
}

message TokenPayload {
  // Tokens consumed by the input stage: the prompt sequence for a prefill
  // step, exactly one sampled token for a decode step (header.phase
  // disambiguates). Field 1 stays wire-compatible with the earlier singular
  // token_id (packed repeated int64 shares the singular varint encoding).
  repeated int64 token_ids = 1;
}

// The hidden-state tensor travels in the tensor bundle under `tensor_key`.
message HiddenStatePayload {
  string tensor_key = 1;
}

// The logits tensor travels in the tensor bundle under `tensor_key`.
message LogitsPayload {
  string tensor_key = 1;
}

message ShardPayload {
  oneof value {
    TokenPayload token = 1;
    HiddenStatePayload hidden_states = 2;
    LogitsPayload logits = 3;
  }
}

message ForwardRequest {
  MessageHeader header = 1;
  ExecutionContext context = 2;
  ShardPayload payload = 3;
  // safetensors-encoded tensor bundle (spec 17.3).
  bytes tensor_bundle = 4;
}

message ForwardReply {
  MessageHeader header = 1;
  ExecutionContext context = 2;
  ShardPayload payload = 3;
  bytes tensor_bundle = 4;
}

message RuntimeInfoRequest {}

message RuntimeInfoReply {
  string model_id = 1;

  int32 stage_index = 2;
  int32 stage_count = 3;

  // Half-open block range [block_start, block_end) (spec 8.3).
  int32 block_start = 4;
  int32 block_end = 5;

  bool include_input_stage = 6;
  bool include_output_stage = 7;

  int32 protocol_version = 8;

  string runtime_id = 9;
}

message CreateSessionRequest {
  string execution_id = 1;
  string session_id = 2;
}

message CreateSessionReply {
  bool ok = 1;
  string detail = 2;
}

message CloseSessionRequest {
  string execution_id = 1;
  string session_id = 2;
}

message CloseSessionReply {
  bool ok = 1;
  string detail = 2;
}

service ShardRuntime {
  rpc GetRuntimeInfo(RuntimeInfoRequest) returns (RuntimeInfoReply);

  rpc CreateSession(CreateSessionRequest) returns (CreateSessionReply);

  rpc CloseSession(CloseSessionRequest) returns (CloseSessionReply);

  rpc Prefill(ForwardRequest) returns (ForwardReply);

  rpc Decode(ForwardRequest) returns (ForwardReply);
}
